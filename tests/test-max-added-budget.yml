name: Test max-added diff budget trips
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect whether the prebuilt bomdrift binary can run here
        id: env
        run: |
          # Released bomdrift linux-gnu binaries require glibc >= 2.39.
          v="$(getconf GNU_LIBC_VERSION 2>/dev/null | awk '{print $2}')"
          [ -z "$v" ] && v="$(ldd --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+$')"
          echo "host glibc: $v"
          if [ -n "$v" ] && [ "$(printf '%s\n2.39\n' "$v" | sort -V | head -1)" = "2.39" ]; then
            echo "runnable=true" >> "$GITHUB_OUTPUT"
          else
            echo "runnable=false" >> "$GITHUB_OUTPUT"
          fi
      - id: within-budget
        name: Control run (budget not exceeded)
        uses: .
        continue-on-error: ${{ steps.env.outputs.runnable != 'true' }}
        with:
          before-sbom: ${{ github.workspace }}/tests/fixtures/before.cdx.json
          after-sbom: ${{ github.workspace }}/tests/fixtures/after.cdx.json
          output: json
          max-added: '5'
          verify-signatures: 'false'
          comment-on-pr: 'false'
          no-epss: 'true'
          no-kev: 'true'
          no-registry: 'true'
      - id: over-budget
        name: Budget exceeded run (expected to fail)
        uses: .
        continue-on-error: true
        with:
          before-sbom: ${{ github.workspace }}/tests/fixtures/before.cdx.json
          after-sbom: ${{ github.workspace }}/tests/fixtures/after.cdx.json
          output: json
          max-added: '0'
          verify-signatures: 'false'
          comment-on-pr: 'false'
          no-epss: 'true'
          no-kev: 'true'
          no-registry: 'true'
      - name: Assert outcomes
        env:
          CONTROL: ${{ steps.within-budget.outcome }}
          OUTCOME: ${{ steps.over-budget.outcome }}
          RUNNABLE: ${{ steps.env.outputs.runnable }}
        run: |
          echo "runnable: $RUNNABLE"
          echo "control outcome: $CONTROL"
          echo "over-budget outcome: $OUTCOME"
          if [ "$RUNNABLE" != "true" ]; then
            for o in "$CONTROL" "$OUTCOME"; do
              if [ "$o" != "success" ] && [ "$o" != "failure" ]; then
                echo "FAIL: unexpected outcome '$o'"
                exit 1
              fi
            done
            echo "PASS: both runs executed (binary not runnable on this host's glibc)"
            exit 0
          fi
          if [ "$CONTROL" != "success" ]; then
            echo "FAIL: control run should succeed"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when max-added=0 and a dependency was added"
            exit 1
          fi
          echo "PASS"
