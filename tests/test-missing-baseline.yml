name: Test missing baseline file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          before-sbom: ${{ github.workspace }}/tests/fixtures/before.cdx.json
          after-sbom: ${{ github.workspace }}/tests/fixtures/after.cdx.json
          baseline: ${{ github.workspace }}/tests/fixtures/does-not-exist.json
          verify-signatures: 'false'
          comment-on-pr: 'false'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing baseline"
            exit 1
          fi
          echo "PASS"
