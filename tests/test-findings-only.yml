name: Test BYO SBOM diff with findings-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      GITHUB_ACTION_REF: v0.9.9
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          before-sbom: ${{ github.workspace }}/tests/fixtures/before.cdx.json
          after-sbom: ${{ github.workspace }}/tests/fixtures/after.cdx.json
          format: cdx
          output: markdown
          comment-on-pr: 'false'
          findings-only: 'true'
          verify-signatures: 'false'
          no-epss: 'true'
          no-kev: 'true'
          no-registry: 'true'

      - name: Assert action completed successfully in findings-only mode
        run: |
          echo "Action completed in findings-only mode without error"
          echo "PASS"
