name: Test findings-only mode (omit raw diff tables)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          before-sbom: ${{ github.workspace }}/tests/fixtures/sbom-before.json
          after-sbom: ${{ github.workspace }}/tests/fixtures/sbom-after.json
          output: markdown
          comment-on-pr: 'false'
          verify-signatures: 'false'
          findings-only: 'true'
          no-epss: 'true'
          no-kev: 'true'
          no-registry: 'true'
        continue-on-error: true

      - name: Assert action ran with findings-only mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully in findings-only mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
