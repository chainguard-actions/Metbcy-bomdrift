name: Test error when before-sbom and before-ref are both unset
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # On workflow_dispatch, github.event.pull_request.base.ref is empty,
      # so before-ref defaults to ''. With before-sbom also unset, the action
      # must fail loudly with a clear error message.
      - id: action
        uses: .
        with:
          after-sbom: ${{ github.workspace }}/tests/fixtures/sbom-after.json
          output: markdown
          comment-on-pr: 'false'
          verify-signatures: 'false'
        continue-on-error: true

      - name: Assert action failed with missing before-sbom/before-ref error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when before-sbom and before-ref are both unset"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when before-sbom and before-ref are both unset"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
