name: Test error when before-sbom file is missing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          before-sbom: /nonexistent/path/before.json
          after-sbom: ${{ github.workspace }}/tests/fixtures/cdx-after.json
          output: markdown
          comment-on-pr: 'false'
          verify-signatures: 'false'

      - name: Assert action failed due to missing before-sbom
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when before-sbom is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when before-sbom file was missing"
