name: Test basic SBOM diff (BYO SBOMs, markdown output)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          before-sbom: ${{ github.workspace }}/tests/fixtures/cdx-minimal.json
          after-sbom: ${{ github.workspace }}/tests/fixtures/cdx-after.json
          output: markdown
          comment-on-pr: 'false'
          verify-signatures: 'false'
          no-epss: 'true'
          no-kev: 'true'
          no-registry: 'true'

      - name: Assert action completed without error
        run: |
          echo "Action step completed successfully"
          echo "PASS"
