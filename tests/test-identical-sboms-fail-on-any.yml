name: Test identical SBOMs do not trip fail-on any
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          before-sbom: ${{ github.workspace }}/tests/fixtures/before.cdx.json
          after-sbom: ${{ github.workspace }}/tests/fixtures/before.cdx.json
          output: markdown
          fail-on: any
          max-added: '0'
          max-removed: '0'
          max-version-changed: '0'
          verify-signatures: 'false'
          comment-on-pr: 'false'
          no-epss: 'true'
          no-kev: 'true'
          no-registry: 'true'
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success for identical SBOMs"
            exit 1
          fi
          echo "PASS"
