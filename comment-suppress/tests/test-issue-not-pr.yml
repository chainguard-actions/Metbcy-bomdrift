name: Test issue_comment on a plain issue is skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_EVENT_PATH: ${{ github.workspace }}/tests/fixtures/event-issue-comment.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          verify-signatures: 'false'
          baseline-path: issue-test/baseline.json
      - name: Assert action succeeded and wrote no baseline
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/issue-test/baseline.json" ]; then
            echo "FAIL: baseline file should not have been created"
            exit 1
          fi
          echo "PASS"
