name: Test suppress command on PR comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake issue_comment event payload (PR comment with suppress command)
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/pr-comment-suppress.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 12,
              "pull_request": {
                "url": "https://api.github.com/repos/owner/repo/pulls/12"
              }
            },
            "comment": {
              "id": 888001,
              "body": "/bomdrift suppress GHSA-abcd-1234-efgh",
              "user": {
                "login": "developer",
                "type": "User"
              }
            }
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: issue_comment
          GITHUB_EVENT_PATH: /tmp/fake-events/pr-comment-suppress.json
        with:
          verify-signatures: 'false'
      - name: Assert action ran (parsed suppress command, then failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (baseline updated and committed)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
