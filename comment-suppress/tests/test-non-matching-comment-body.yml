name: Test non-matching comment body
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake issue_comment event payload (PR comment, non-matching body)
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/pr-comment-no-suppress.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 7,
              "pull_request": {
                "url": "https://api.github.com/repos/owner/repo/pulls/7"
              }
            },
            "comment": {
              "id": 999001,
              "body": "Great work! LGTM.",
              "user": {
                "login": "reviewer",
                "type": "User"
              }
            }
          }
          EOF
      - id: action
        uses: .
        env:
          GITHUB_EVENT_NAME: issue_comment
          GITHUB_EVENT_PATH: /tmp/fake-events/pr-comment-no-suppress.json
        with:
          verify-signatures: 'false'
      - name: Assert action exited cleanly for non-matching comment body
        run: |
          echo "Action completed without error for a PR comment that does not contain /bomdrift suppress"
          echo "PASS"
