name: Test default verify-signatures installs cosign and skips non-comment event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert action succeeded and cosign is available
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v cosign >/dev/null 2>&1; then
            echo "FAIL: cosign should be installed when verify-signatures is true"
            exit 1
          fi
          cosign version || true
          if [ -e "$GITHUB_WORKSPACE/.bomdrift/baseline.json" ]; then
            echo "FAIL: baseline file should not have been created"
            exit 1
          fi
          echo "PASS"
